name: Extract ET-QNN prebuilts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Show QNN libs in the published APK
        run: |
          curl -sL --retry 3 -o app.apk \
            https://github.com/hUh63/OpenOmniBot-omniinfer/releases/download/v0.6.3-omniinfer-v6.5.1/app-production-omniinfer-release.apk
          ls -l app.apk
          unzip -l app.apk | grep -iE "Qnn|etqnn" | head -40

      - name: Extract QNN prebuilts
        run: |
          mkdir -p out
          unzip -j -o app.apk \
            "lib/arm64-v8a/libetqnn_runner.so" \
            "lib/arm64-v8a/libqnn_executorch_backend.so" \
            "lib/arm64-v8a/libQnn*.so" \
            -d out
          ls -l out

      - name: Publish mirror release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: hUh63/OpenOmniBot-omniinfer
        run: |
          set -e
          if gh release view etqnn-prebuilt-v3 -R "$REPO" >/dev/null 2>&1; then
            echo "release already exists"
          else
            gh release create etqnn-prebuilt-v3 -R "$REPO" \
              --title "ET-QNN prebuilt v3 (mirror)" \
              --notes "Mirror of the OmniInfer ExecuTorch QNN Android binaries (v3). The original OSS source (omnimind-model.oss-cn-beijing.aliyuncs.com/omniinfer-android/arm64-v8a) began returning 404 on 2026-10-20; these files were extracted from the signed v6.5.1 APK built from the same source." \
              --prerelease
          fi
          gh release upload etqnn-prebuilt-v3 -R "$REPO" out/*.so --clobber
          gh release view etqnn-prebuilt-v3 -R "$REPO"
