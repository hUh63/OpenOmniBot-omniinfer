name: Import source tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source tarball
        run: |
          curl -sS -m 1800 -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/559581252" \
            -o /tmp/src_full.tar.gz
          ls -la /tmp/src_full.tar.gz

      - name: Reset worktree and extract
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar xzf /tmp/src_full.tar.gz -C .
          rm -rf third_party/omniinfer/framework
          git checkout HEAD -- .github/workflows
          ls -la

      - name: Commit and push to omniinfer-apk
        run: |
          git config user.email "hUh63@users.noreply.github.com"
          git config user.name "hUh63"
          git add -A
          git add -f third_party/omniinfer/android third_party/omniinfer/tmp
          git commit -m "Add MediaTek NPU (LiteRT dispatch) support for Dimensity + auto NPU backend"
          git push origin HEAD:refs/heads/omniinfer-apk --force
