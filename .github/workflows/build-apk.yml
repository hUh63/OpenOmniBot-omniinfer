name: Build OmniInfer Edition APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: webchat/pnpm-lock.yaml

      - name: Install NDK 28.2.13676358
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Fetch framework sources
        run: |
          FB=third_party/omniinfer/framework
          mkdir -p $FB
          curl -sSL "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/b10919" -o /tmp/llama.tgz
          tar xzf /tmp/llama.tgz -C /tmp
          rm -rf $FB/llama.cpp
          mv /tmp/llama.cpp-b10919 $FB/llama.cpp
          # All CPU variants are kept in the build. Unstable ones (SVE/SVE2) are
          # avoided at runtime by the conservative auto-downgrade logic instead.
          echo "--- Android CPU variants ---"
          grep -n "android_armv" $FB/llama.cpp/ggml/src/CMakeLists.txt
          curl -sSL "https://codeload.github.com/alibaba/mnn/tar.gz/a03b005cf6f888ebf092e4753840f935827f9c36" -o /tmp/mnn.tgz
          tar xzf /tmp/mnn.tgz -C /tmp
          rm -rf $FB/mnn
          mv /tmp/MNN-a03b005cf6f888ebf092e4753840f935827f9c36 $FB/mnn
          ls $FB/llama.cpp/CMakeLists.txt $FB/mnn/CMakeLists.txt

      - name: Flutter pub get
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Gradle assembleProductionOmniinferRelease
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          printf '%s' "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"
          chmod +x ./gradlew
          # plugins/catalog.v1.json points at runtime-components/omniflow-gui-runtime-2.2.12.zip;
          # :app:syncPluginAssets uses artifacts/<that name> as its baseline input, so the archive
          # is committed in this repo (taken from upstream's
          # codex/current-version-checkpoint-20260920 branch, sha256 verified against the catalog).
          ./gradlew --no-daemon --build-cache --max-workers=4 \
            assembleProductionOmniinferRelease \
            -Ptarget=lib/main_omniinfer.dart \
            -Pomniinfer.abis=arm64-v8a \
            -POMNI_RELEASE_STORE_FILE="$RUNNER_TEMP/release.p12" \
            -POMNI_RELEASE_STORE_PWD="${{ secrets.RELEASE_PASSWORD }}" \
            -POMNI_RELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -POMNI_RELEASE_KEY_PWD="${{ secrets.RELEASE_PASSWORD }}"

      - name: Collect APK
        run: |
          mkdir -p apk-out
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk-out/ \;
          ls -la apk-out

      - name: Verify APK contents (arm64-only + ggml variants + NPU dispatch)
        run: |
          APK=$(ls apk-out/*.apk | head -1)
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" > /tmp/apk_list.txt
          grep -qi "libLiteRtDispatch_MediaTek.so" /tmp/apk_list.txt \
            && echo "NPU dispatch lib present" \
            || { echo "ERROR: LiteRtDispatch_MediaTek.so missing"; exit 1; }
          VARIANTS=$(grep -o "libggml-cpu-android_[a-z0-9_.]*\.so" /tmp/apk_list.txt | sort -u | wc -l)
          echo "ggml CPU variants: $VARIANTS"
          [ "$VARIANTS" -ge 7 ] || { echo "ERROR: expected >=7 CPU variants, got $VARIANTS"; exit 1; }
          # Release builds pass -Pomniinfer.abis=arm64-v8a: LiteRT's x86_64 slice
          # must not be shipped (upstream OmniInfer guidance).
          if grep -q "lib/x86_64/" /tmp/apk_list.txt; then
            echo "ERROR: x86_64 libs present but arm64-only was requested"; exit 1
          fi
          echo "APK shape OK (arm64-v8a only)"

      - name: Publish APK to a release (CDN delivery)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.3-omniinfer-v6.5.9
          # Without this the tag lands on the default branch's HEAD instead of the
          # commit this build actually checked out.
          target_commitish: ${{ github.sha }}
          name: "OmniInfer 版 · 静默断流不再卡死 / Android 15 前台服务 / 提醒与下载一组 (v0.6.3-omniinfer-v6.5.9)"
          prerelease: true
          draft: false
          body: |
            本轮 (v6.5.9)：6 个提交，主线是「不再永久停在思考中」和「targetSdk 36 下的
            前台服务 / 提醒 / 下载不再静默坏掉」。全部改动只过编译门，未做真机回归。

            一、回合永久卡在 thinking（SSE 静默断流）
            - 通道层：ChatTask（小万普通对话）的收尾只挂在 onClosed / onFailure 上，而上游或
              中间代理静默断流时两者都不回调 —— Dart 侧永远收不到 onChatMessageEnd，任务不
              结束、taskId 永久占位。补按「最后一次事件」的空闲看门狗（180s），超时走既有
              失败收尾。
            - 上下文压缩：摘要流裸 await() 一个只能由回调完成的 Deferred，断流时永不返回，
              而它正处在回合主链上 → 整条回合永久 thinking。同样补空闲看门狗，超时按压缩
              失败处理（AgentLlmClient 早就有这个 watchdog，这两处漏了）。

            二、Android 15 / targetSdk 36 兼容
            - IM 渠道开机自启：Android 15 禁止从 BOOT_COMPLETED 启动 dataSync 型前台服务，
              原来没兜住 → 开机即崩且渠道永久不恢复。补异常兜底（下次打开 App 再拉起）。
            - IM 渠道常驻服务：补 onTimeout —— dataSync 型 FGS 有 6h/24h 配额，到点不自己
              stopSelf 会抛 RemoteServiceException 崩进程。
            - 提醒闹钟：响铃服务原来返回 START_STICKY，进程被回收后系统以 null intent 重启，
              代码直接 stopSelf → 铃声和通知一起消失，而记录已落成 ringing、重排又把
              ringing 排除 —— 这条提醒本次开机周期内永远不会再响。改为 START_NOT_STICKY。
            - 开机重排补「精确闹钟权限」判断（原来函数名叫 IfPermitted 却没检查，没权限时
              静默降级成非精确闹钟，仍报成功）。

            三、本地模型下载
            - MNN 仓库下载：缺 416 分支，.part 长度已达标后每次「继续下载」都 416 且 .part
              永不清理 → 永久失败；renameTo 返回值被丢弃 → 可能报 success 但盘上只有 .part
              （列表还看不到）。补 416 清理与 rename 校验。
            - LiteRT 下载：同样缺 416 恢复，补「删 .part 后报可重试错误」。
            - QNN / MNN：补下载前剩余空间预检（llama.cpp 分支早就有），避免下到一半 ENOSPC
              只留几 GB 垃圾。
            - 端口变更：四个后端的 saveConfig 都在方法通道主线程执行，而改端口会连带 stop()
              卸载引擎（native free 掉几 GB 模型）。统一挪到 IO。
            - llama / QNN / LiteRT 的 startDownload / pauseDownload 同样从主线程挪到 IO
              （MNN 分支早已如此）。
            - litert-npu 后端在通道分派里缺失：会落到 else 被当成 llama.cpp（列 GGUF、下
              GGUF，再把 .gguf 交给 NPU 后端加载）。分派与 getCurrentConfig 两处补齐。

            四、局域网代理
            - start(wait=false) 后不核对端口是否真绑上就置 running：端口被占用时对外报一个
              连不上的地址，且之后每次 start() 都被「已运行且端口相同」早退拦住，只能杀
              进程恢复。补 600ms 异步自检，失败则释放并允许重试。

            五、文件与保存
            - 系统保存对话框（SAF）与 MediaStore 直存两条路径都在主线程整文件 copyTo，
              几十 MB 的录屏/日志必然 ANR。两条都挪到 IO，直存失败回主线程回退到对话框。
            - 浏览器分享暂存目录 browser_shared_exports 只写不删 → 补「保留 24 个 / 2 天」清理；
              目录落在 FileProvider 覆盖范围外时不再重试同一个必然失败的调用。

            六、浏览器
            - 补 onRenderProcessGone：渲染进程崩溃时默认返回 false 会让系统连宿主进程一起
              杀；即便不崩，该 WebView 的 evaluateJavascript 回调也永不回调（只能等满 15s），
              tab 还占位不重建。现在接管异常、收掉该 tab。
            - 截图 JPEG 压缩 / 写盘 / base64 从主线程挪到 Default（只有 draw 必须在主线程）。
            - 面板快照原来一次调 6 次 downloadManager.snapshot()（每次读 MMKV + 全量 JSON
              反序列化），而页面进度 400ms 就重建一次快照，全落在主线程。改为只读一次。
            - 文件选择器投递 Activity 被系统重建时按取消收场，避免页面 <input type=file>
              永久卡在「等待选择」。

            七、日程 / 定时 / 记忆
            - 全天日程「只改标题」也会把结束日往后推一天（更新时 DTEND 已是排他端点，又被
              +1 天）。为已排他的端点单独分支。
            - 定时任务「停用」原来走 cancelTask，原生会连 Flutter 侧记录一起删 —— 停用变成
              彻底删除、重启后消失且无法再启用。统一改走 scheduleTask（upsert 保留记录）。
            - MEMORY.md 设置页整篇覆盖写会吃掉期间 agent / 夜间整理追加的条目：保存前比对
              最新内容，变了且用户编辑过则弹窗选「重新加载」或「覆盖保存」。

            八、UI 与性能
            - 附件卡片两处 await 后 setState 缺 mounted 守卫（卡片被复用即崩）。
            - 触底自动加载历史的 catch 里 rethrow，而这个 Future 被 unawaited 丢弃 → 变成
              无人接收的异步错误。改为静默收场。
            - 消息 linkPreviews 每次访问都整份反序列化（流式每个 chunk 都触发）→ 惰性缓存。
            - 多图附件渲染的 indexOf 线性查找（O(n²)）→ 同一性查表。
            - 计时条每秒 setState 重建整行 → ValueNotifier + ValueListenableBuilder 只重建文本。
            - 批量静态文案改走 LegacyTextLocalizer（68 处），跟随语言设置。
            - 平台调用补超时：overlay 7 个方法 10s 上限 + 通用 catch；网络公共参数 version
              取真实 versionName（原来硬编码 1.0.0），同名 query 参数由 add 改 set。

            九、CI
            - 删除早已被清空的 sync-models-dev workflow（每次 push 都跑出一个无效 workflow
              的 failure，把 Actions 列表长期染红）。

            上游同步：a5334740 的 onboarding 改动已按新版重写落地（新增可选的「选择模型服务商」
            步骤、provider 页常驻渲染保持登录态、footer 增加导航中心），26ac7f4d 的会话滑动
            归档早已随 conversation_slidable 落地；抽屉顶部搜索头保留我们自己的实现（上游那版
            依赖我们尚未引入的组件，功能等价）。provider 页保留本仓版本（含本地模型 / 自定义
            API 入口）。

            安装后如遇异常，请反馈具体操作路径。
          files: apk-out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push APK chunks to artifacts branch
        run: |
          git config user.email "hUh63@users.noreply.github.com"
          git config user.name "hUh63"
          mkdir -p chunks
          split -b 90m -d apk-out/*.apk chunks/app.part_
          git checkout --orphan apk-artifacts
          git rm -rf . -q || true
          git add -f chunks/
          git commit -m "APK chunks $(date -u +%Y%m%d%H%M%S)"
          git push origin apk-artifacts --force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniinfer-apk
          path: apk-out/*.apk
          if-no-files-found: error
