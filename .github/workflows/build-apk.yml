name: Build OmniInfer Edition APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: webchat/pnpm-lock.yaml

      - name: Install NDK 28.2.13676358
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Fetch framework sources
        run: |
          FB=third_party/omniinfer/framework
          mkdir -p $FB
          curl -sSL "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/b10919" -o /tmp/llama.tgz
          tar xzf /tmp/llama.tgz -C /tmp
          rm -rf $FB/llama.cpp
          mv /tmp/llama.cpp-b10919 $FB/llama.cpp
          # All CPU variants are kept in the build. Unstable ones (SVE/SVE2) are
          # avoided at runtime by the conservative auto-downgrade logic instead.
          echo "--- Android CPU variants ---"
          grep -n "android_armv" $FB/llama.cpp/ggml/src/CMakeLists.txt
          curl -sSL "https://codeload.github.com/alibaba/mnn/tar.gz/a03b005cf6f888ebf092e4753840f935827f9c36" -o /tmp/mnn.tgz
          tar xzf /tmp/mnn.tgz -C /tmp
          rm -rf $FB/mnn
          mv /tmp/MNN-a03b005cf6f888ebf092e4753840f935827f9c36 $FB/mnn
          ls $FB/llama.cpp/CMakeLists.txt $FB/mnn/CMakeLists.txt

      - name: Flutter pub get
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Gradle assembleProductionOmniinferRelease
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          printf '%s' "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"
          chmod +x ./gradlew
          # plugins/catalog.v1.json points at runtime-components/omniflow-gui-runtime-2.2.12.zip;
          # :app:syncPluginAssets uses artifacts/<that name> as its baseline input, so the archive
          # is committed in this repo (taken from upstream's
          # codex/current-version-checkpoint-20260920 branch, sha256 verified against the catalog).
          ./gradlew --no-daemon --build-cache --max-workers=4 \
            assembleProductionOmniinferRelease \
            -Ptarget=lib/main_omniinfer.dart \
            -Pomniinfer.abis=arm64-v8a \
            -POMNI_RELEASE_STORE_FILE="$RUNNER_TEMP/release.p12" \
            -POMNI_RELEASE_STORE_PWD="${{ secrets.RELEASE_PASSWORD }}" \
            -POMNI_RELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -POMNI_RELEASE_KEY_PWD="${{ secrets.RELEASE_PASSWORD }}"

      - name: Collect APK
        run: |
          mkdir -p apk-out
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk-out/ \;
          ls -la apk-out

      - name: Verify APK contents (arm64-only + ggml variants + NPU dispatch)
        run: |
          APK=$(ls apk-out/*.apk | head -1)
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" > /tmp/apk_list.txt
          grep -qi "libLiteRtDispatch_MediaTek.so" /tmp/apk_list.txt \
            && echo "NPU dispatch lib present" \
            || { echo "ERROR: LiteRtDispatch_MediaTek.so missing"; exit 1; }
          VARIANTS=$(grep -o "libggml-cpu-android_[a-z0-9_.]*\.so" /tmp/apk_list.txt | sort -u | wc -l)
          echo "ggml CPU variants: $VARIANTS"
          [ "$VARIANTS" -ge 7 ] || { echo "ERROR: expected >=7 CPU variants, got $VARIANTS"; exit 1; }
          # Release builds pass -Pomniinfer.abis=arm64-v8a: LiteRT's x86_64 slice
          # must not be shipped (upstream OmniInfer guidance).
          if grep -q "lib/x86_64/" /tmp/apk_list.txt; then
            echo "ERROR: x86_64 libs present but arm64-only was requested"; exit 1
          fi
          echo "APK shape OK (arm64-v8a only)"

      - name: Publish APK to a release (CDN delivery)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.3-omniinfer-v6.5.7
          # Without this the tag lands on the default branch's HEAD (which is how
          # v1/v2/v3 all ended up pointing at the same old commit) instead of the
          # commit this build actually checked out. Mirrors release.yml:302.
          target_commitish: ${{ github.sha }}
          name: "OmniInfer 版 · 浏览器 AI 接管 / 上游同步 / 安装与并发卡死 (v0.6.3-omniinfer-v6.5.7)"
          prerelease: true
          draft: false
          body: |
            本轮 (v6.5.7)：29 个提交，主题是「让 AI 真的能操作浏览器」+「把会永久卡死的锁和
            标志位拆掉」，并同步了上游 v0.6.3.4~v0.6.3.6 中适用于本分支的修复。

            一、浏览器会话：AI 可以接管，你也可以随时收回
            - AI 能控制页面了：移除 browser_use / webfetch 的「所有文件访问」权限前置检查
              （浏览器只在内置 WebView 里跑、产物落在 app 私有目录，本来不需要存储权限）。
              之前这条检查会让工具直接不可用，表现就是「AI 调不了浏览器」。
            - 控制权状态机：新增 aiControlEnabled。用户在页面上任何一次触摸（ACTION_DOWN）
              都会自动把 AI 暂停，只读动作（读文字 / 截图 / 取页面信息）不受影响，AI 仍然
              看得懂你把页面操作到哪了。
            - 提示与恢复：浏览器面板顶部常驻横幅，显示「AI 正在控制」还是「你正在操作、
              AI 已暂停」，一键「我来操作 / 恢复 AI 控制」，任何时刻都能双向切换。
            - 智能弹出：AI 开始改页面时自动把面板摆出来；你手动关掉之后本次不再打扰，
              除非它卡在弹窗 / 权限 / 风控等你必须处理的环节。
            - 每轮新 run 重新授权 AI，避免上一次触摸导致之后所有动作都被拒（而面板没打开、
              你看不到恢复按钮）。

            二、会永久卡死的锁与标志位（本轮逐行审计的结果）
            - evaluateJavascript 加 15s 上限。页面弹窗 / 死循环脚本 / renderer 卡住时回调永不
              触发，而这个协程持有浏览器动作锁 —— AI 等 JS、JS 等用户关弹窗、用户关弹窗的
              请求在等锁，三方死锁，整条链路（含取快照）一起冻住。
            - 快照 / 预览 / 停止加载 / 弹窗与权限应答 / 控制权切换改为不进动作锁：停止按钮
              此前必须等 30s 导航超时才拿到锁，拿到时再 stopLoading 已经没有意义。
            - 浏览器引擎被 LRU 淘汰时跳过正在执行的引擎，destroy 后禁止再建 WebView；标签页
              封顶 8、先校验 transport 再建 tab；关闭引擎时清掉挂起的弹窗/权限/外链请求。

            三、装不上的预置 Agent（Codex / DeepSeek Harness）
            - 「重新安装」现在真的会安装。当前连着别的 Agent 时走的那条分支只做「构造启动
              环境 + 检查命令存在」，而构造环境的约定就是「只给已安装的 Harness 用，绝不装
              依赖」，于是永远只检查、永远装不上。
            - 一次 prepare 不再跑两遍完整 npm 脚本（第二遍失败会把「已装好」的状态覆盖成
              失败，用户看到「安装失败」而包其实装好了）。
            - 安装器真实报错不再被压成「助手未能启动，请重试」；且「应用自有安装错误」优先于
              timeout / command not found 判定，npm 失败不会再被改写成「等待回复超时」。
            - 取消不再被当成失败：离开设置页 / 切 Agent 不会再把该 Harness 永久标成离线。
            - 可用性探针整体失败（终端冷启动超时、脚本异常）不再被当成「所有 Agent 都没装」
              并批量写 missing —— 那会让装好的 Codex / DSH 全显示「未安装」并引导重装。
            - ACP prompt 增加空闲看门狗：适配器活着但不回话时，turn 预约会永久不释放，之后
              同一会话每次请求都被拒；10 分钟无任何响应即判失败并释放。

            四、本地模型
            - 暂停后立刻重新下载不会再把新任务的表项摘掉（否则暂停变空操作、两个任务并发写
              同一个 .part，最后仍被判成功，得到一个损坏的模型目录）；QNN / LiteRT 也不会
              把暂停的任务报成「已完成」。
            - 删除未完成下载改为「先取消再删目录」：否则下载协程会把刚删的目录建回来继续写。
            - 下载 / 暂停不再在主线程递归遍历目录 + StatFs；模型通道的同步分支统一兜异常
              （原来任何异常都会让主线程 FATAL，且 Dart 侧永久 await）。
            - 推荐模型探测不再顺手切后端（那会停掉你正在跑的 MNN/QNN/LiteRT 引擎和局域网代理）。

            五、WebChat（浏览器里那个网页端）
            - 运行态按会话隔离：切会话不再被上一会话的「运行中」锁死，停止按钮也不会取消到
              别的会话；别的会话的任务完成事件不再清掉当前运行态。
            - 401 有出口了：MCP 服务重启 / 会话过期后回登录页，而不是停在「已登录」并每 3 秒
              重试一次 401。
            - SSE 断线重连后补一次快照（服务端不重放事件，最终回答和任务结束会丢）。
            - 侧边栏分组按 agentId：服务端把 mode 归一成 agent，原来 Codex / Claude / OpenCode
              / DeepSeek 四个分组永远是空的、标签全显示「小万」。
            - 请求加 30s 超时、消息加载只接受最新一次结果、草稿按会话隔离。

            六、上游同步
            - 取上游 v0.6.3.4~v0.6.3.6 中与本分支同源、可独立验证的修复：模型缓存字段写死
              JSON key、发布包关闭标识符混淆（保留可读崩溃堆栈）、dex 压缩打包、WebChat
              请求体改 Gson 解析（异构 map 交给 kotlinx 转换器会整请求失败）、Agent 展示顺序
              统一（含 WebChat 新建菜单里「小万」重复一条）。
            - OmniInfer：核对后无需更新 —— 上游 android/ 目录在 2026-09-18 之后没有任何提交，
              v0.3.29~v0.3.31 的增量全在桌面端与 gateway；本分支内嵌的 SDK 已覆盖到 09-18 的
              全部内容，并额外带了我们自己的 JNI 串行化与 session 生命周期加固。

            全部改动只经过编译门（verify-omniinfer）验证，尚未做真机回归；安装后如遇异常请反馈
            具体操作路径。
          files: apk-out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push APK chunks to artifacts branch
        run: |
          git config user.email "hUh63@users.noreply.github.com"
          git config user.name "hUh63"
          mkdir -p chunks
          split -b 90m -d apk-out/*.apk chunks/app.part_
          git checkout --orphan apk-artifacts
          git rm -rf . -q || true
          git add -f chunks/
          git commit -m "APK chunks $(date -u +%Y%m%d%H%M%S)"
          git push origin apk-artifacts --force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniinfer-apk
          path: apk-out/*.apk
          if-no-files-found: error
