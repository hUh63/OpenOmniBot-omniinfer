name: Build OmniInfer Edition APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: webchat/pnpm-lock.yaml

      - name: Install NDK 28.2.13676358
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Fetch framework sources
        run: |
          FB=third_party/omniinfer/framework
          mkdir -p $FB
          curl -sSL "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/b10919" -o /tmp/llama.tgz
          tar xzf /tmp/llama.tgz -C /tmp
          rm -rf $FB/llama.cpp
          mv /tmp/llama.cpp-b10919 $FB/llama.cpp
          # All CPU variants are kept in the build. Unstable ones (SVE/SVE2) are
          # avoided at runtime by the conservative auto-downgrade logic instead.
          echo "--- Android CPU variants ---"
          grep -n "android_armv" $FB/llama.cpp/ggml/src/CMakeLists.txt
          curl -sSL "https://codeload.github.com/alibaba/mnn/tar.gz/a03b005cf6f888ebf092e4753840f935827f9c36" -o /tmp/mnn.tgz
          tar xzf /tmp/mnn.tgz -C /tmp
          rm -rf $FB/mnn
          mv /tmp/MNN-a03b005cf6f888ebf092e4753840f935827f9c36 $FB/mnn
          ls $FB/llama.cpp/CMakeLists.txt $FB/mnn/CMakeLists.txt

      - name: Flutter pub get
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Gradle assembleProductionOmniinferRelease
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          printf '%s' "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"
          chmod +x ./gradlew
          # plugins/catalog.v1.json points at runtime-components/omniflow-gui-runtime-2.2.12.zip;
          # :app:syncPluginAssets uses artifacts/<that name> as its baseline input, so the archive
          # is committed in this repo (taken from upstream's
          # codex/current-version-checkpoint-20260920 branch, sha256 verified against the catalog).
          ./gradlew --no-daemon --build-cache --max-workers=4 \
            assembleProductionOmniinferRelease \
            -Ptarget=lib/main_omniinfer.dart \
            -Pomniinfer.abis=arm64-v8a \
            -POMNI_RELEASE_STORE_FILE="$RUNNER_TEMP/release.p12" \
            -POMNI_RELEASE_STORE_PWD="${{ secrets.RELEASE_PASSWORD }}" \
            -POMNI_RELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -POMNI_RELEASE_KEY_PWD="${{ secrets.RELEASE_PASSWORD }}"

      - name: Collect APK
        run: |
          mkdir -p apk-out
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk-out/ \;
          ls -la apk-out

      - name: Verify APK contents (arm64-only + ggml variants + NPU dispatch)
        run: |
          APK=$(ls apk-out/*.apk | head -1)
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" > /tmp/apk_list.txt
          grep -qi "libLiteRtDispatch_MediaTek.so" /tmp/apk_list.txt \
            && echo "NPU dispatch lib present" \
            || { echo "ERROR: LiteRtDispatch_MediaTek.so missing"; exit 1; }
          VARIANTS=$(grep -o "libggml-cpu-android_[a-z0-9_.]*\.so" /tmp/apk_list.txt | sort -u | wc -l)
          echo "ggml CPU variants: $VARIANTS"
          [ "$VARIANTS" -ge 7 ] || { echo "ERROR: expected >=7 CPU variants, got $VARIANTS"; exit 1; }
          # Release builds pass -Pomniinfer.abis=arm64-v8a: LiteRT's x86_64 slice
          # must not be shipped (upstream OmniInfer guidance).
          if grep -q "lib/x86_64/" /tmp/apk_list.txt; then
            echo "ERROR: x86_64 libs present but arm64-only was requested"; exit 1
          fi
          echo "APK shape OK (arm64-v8a only)"

      - name: Publish APK to a release (CDN delivery)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.3-omniinfer-v6.5.5
          # Without this the tag lands on the default branch's HEAD (which is how
          # v1/v2/v3 all ended up pointing at the same old commit) instead of the
          # commit this build actually checked out. Mirrors release.yml:302.
          target_commitish: ${{ github.sha }}
          name: "OmniInfer 版 · 稳定性专项 40 项修复（事件流/定时任务/浏览器会话/自动刷新） (v0.6.3-omniinfer-v6.5.5)"
          prerelease: true
          draft: false
          body: |
            本轮 (v6.5.5)：稳定性专项，共 40 处修复。来自对聊天、agent 运行时、存储与 DAO、IM/终端/浏览器、记忆与定时任务、工具与技能、webchat 七个域的逐行审计。

            一、一次失败就永久坏掉（本类最多）
            - 事件消费协程无保护：webchat 的 agent 事件循环、IM 的实时事件订阅，单条事件处理失败（脏数据 / DB / 网络发送异常）就让协程永久退出 —— 网页端一直显示“运行中”、停止按钮失效；IM 用户发消息后再也收不到回复。已加异常隔离。
            - 本地模型事件通道：Dart 侧吞掉 onError 却把“已接线”标记留成 true，一次错误后下载进度 / 排队提示永久不刷新。
            - agent 运行时事件通道：订阅 done 后引用不复位，引擎重建后运行状态再也不更新。
            - 语音播放：_initialized 先置位再 await，首次配置读取失败就再也订阅不上事件，按钮永远停在“播放中”。
            - 夜间记忆整理：排下一次闹钟写在整理之后，一次失败（断网 / 模型不可用）夜间整理永久停摆，“下次整理”时间一直停在过去。
            - 抽屉搜索：异常后仍显示“搜索中”并残留上一次结果。
            - 归档页“加载更多”：_isLoadingMore 只在成功分支复位，刷新抢跑或失败后永远翻不了页。
            - 终端命令：未指定超时就无限等待（会话初始化正是这样传的），整轮 agent 挂死 —— 现在 120 秒兜底。

            二、定时任务的语义被写反了
            - “停用任务”原来实现成 deleteTask（连 Flutter 存储一起删），任务消失且不可恢复；改为 upsert（原生取消闹钟、清空下次执行时间、保留记录）。
            - 编辑弹窗恒写 isEnabled=true：编辑一个停用任务会悄悄重新启用并排上闹钟。
            - 错过时间的一次性任务被顺延到将来，第二天打开 App 突然执行一次；改为过期即失效。
            - 一次性任务执行失败也照样删除，既无通知也查不到记录；改为保留并停用。
            - 原生与 Flutter 双写 scheduled_tasks，而 Dart 侧 SharedPreferences 是进程级内存缓存且从不 reload：列表长期显示旧的“下次执行时间”，已执行的一次性任务被整表写回“复活”并重复执行。现在读取前按 2 秒节流 reload。

            三、状态被旧快照覆盖
            - 更新会话时整行写回 lastMessage / messageCount，而 Flutter 传来的是几秒前的列表快照 —— 抽屉里最后一条消息回退、会话莫名跳到顶部。现在只有 messageCount 确实更靠前才采用。
            - 本地模型页 3 秒轮询的旧快照晚于“启动服务”结果落地，刚起来的服务被刷回“未启动”（加代际号）。
            - 归档 / 删除一条会话后分页游标不退格，删一条就永久少一条更早的会话。
            - 技能开关被整表 seed 覆盖（刚关掉的技能自己打开、removed_builtin 复活）；删除技能失败却删掉 registry 条目，技能以启用状态复活。

            四、分页与列表
            - 消息分页 offset 改用 SQL 实际消费行数（组装阶段会丢掉 transport / 空内容条目，用消息条数推进会反复重读同一段；整页被过滤时 offset 原地不动、向上翻历史卡死）。
            - 消息分页按 id 去重（删消息 / 合并会让 offset 窗口错位，出现重复消息）。
            - getConversationsByPage 由“全表取回再内存切片”改成真正的 SQL 分页，并移出 Default 调度器。
            - webchat 会话分页返回 scanned 供游标推进。

            五、卡死与资源泄漏
            - ACP 权限请求没有 try/finally，pending 登记在 emit 失败 / 取消时永久残留；同 id 的后续响应打在已死的 Deferred 上却返回 ok=true。
            - 终端会话关闭失败仍删掉所有权登记，shell 既停不掉也回收不了（该登记同时是鉴权依据）。
            - 工作区文件读取不论请求多少字符都先整份 readText，上百 MB 文件预览直接 OOM；改为流式切片。
            - 浏览器会话每个 workspace 一个常驻 WebView 引擎且只增不减；改为最多保活 2 个（LRU 淘汰，销毁在锁外执行）。
            - WebAgentRunBridge / AgentRunService 每份实例各持一套事件通道与协程作用域（MCP 每次启停都新建一份）；改为进程级共享，runContexts 按会话收敛。
            - RealtimeHub 无订阅者时 emit 挂起 + 无界队列导致内存持续增长；改有界缓冲 + 丢弃最旧。
            - 通知等待工具不按 schema 收敛超时，模型给 86400 就真阻塞 24 小时；按 1~120 秒收敛。

            六、安全
            - webchat 的局域网判定优先信任 X-Forwarded-For / X-Real-IP（客户端可任意伪造），改为真实 TCP 对端地址。

            七、IM
            - Telegram 轮询循环判断的是共享字段而非自身 Job：改配置重启后旧循环仍在跑，同一条消息被处理两次并持续返回 409。
            - 分片发送失败被吞、done 先置位、hasSentAny 无条件置真：长回答结尾永久丢失且无提示。已改为按结果置位。
            - 进程重启后残留的 activeTaskId 让该 peer 所有消息都被回“已有任务运行中”；首次初始化统一清理。

            八、webchat
            - /events 空闲时不发任何数据，手机锁屏 / 路由 NAT 会静默掐断连接而前端以为还连着（页面不再自动刷新）；加 15 秒心跳，写失败即断开以触发重连。

            九、长会话性能
            - 时间线分组每个 run 都全表过滤一次（O(消息数 × 轮次数)），长会话每新增一张卡片都在 UI 线程重算几十万次比较；改为单遍按 taskId 分组。
            - 抽屉缩略图按需加载 + 12 秒节流，并修掉“在飞标记泄漏”（流式输出中签名变化会让该会话缩略图永久不更新）。

            全部改动只经过编译门（verify-omniinfer）验证，尚未做真机回归；安装后如遇异常请反馈具体操作路径。
      - name: Push APK chunks to artifacts branch
        run: |
          git config user.email "hUh63@users.noreply.github.com"
          git config user.name "hUh63"
          mkdir -p chunks
          split -b 90m -d apk-out/*.apk chunks/app.part_
          git checkout --orphan apk-artifacts
          git rm -rf . -q || true
          git add -f chunks/
          git commit -m "APK chunks $(date -u +%Y%m%d%H%M%S)"
          git push origin apk-artifacts --force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniinfer-apk
          path: apk-out/*.apk
          if-no-files-found: error
