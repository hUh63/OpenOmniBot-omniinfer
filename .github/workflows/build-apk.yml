name: Build OmniInfer Edition APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: webchat/pnpm-lock.yaml

      - name: Install NDK 28.2.13676358
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Fetch framework sources
        run: |
          FB=third_party/omniinfer/framework
          mkdir -p $FB
          curl -sSL "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/b10919" -o /tmp/llama.tgz
          tar xzf /tmp/llama.tgz -C /tmp
          rm -rf $FB/llama.cpp
          mv /tmp/llama.cpp-b10919 $FB/llama.cpp
          # All CPU variants are kept in the build. Unstable ones (SVE/SVE2) are
          # avoided at runtime by the conservative auto-downgrade logic instead.
          echo "--- Android CPU variants ---"
          grep -n "android_armv" $FB/llama.cpp/ggml/src/CMakeLists.txt
          curl -sSL "https://codeload.github.com/alibaba/mnn/tar.gz/a03b005cf6f888ebf092e4753840f935827f9c36" -o /tmp/mnn.tgz
          tar xzf /tmp/mnn.tgz -C /tmp
          rm -rf $FB/mnn
          mv /tmp/MNN-a03b005cf6f888ebf092e4753840f935827f9c36 $FB/mnn
          ls $FB/llama.cpp/CMakeLists.txt $FB/mnn/CMakeLists.txt

      - name: Flutter pub get
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Gradle assembleProductionOmniinferRelease
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          printf '%s' "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"
          chmod +x ./gradlew
          ./gradlew --no-daemon --build-cache --max-workers=4 \
            assembleProductionOmniinferRelease \
            -Ptarget=lib/main_omniinfer.dart \
            -POMNI_RELEASE_STORE_FILE="$RUNNER_TEMP/release.p12" \
            -POMNI_RELEASE_STORE_PWD="${{ secrets.RELEASE_PASSWORD }}" \
            -POMNI_RELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -POMNI_RELEASE_KEY_PWD="${{ secrets.RELEASE_PASSWORD }}"

      - name: Collect APK
        run: |
          mkdir -p apk-out
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk-out/ \;
          ls -la apk-out

      - name: Verify APK contents (MediaTek NPU dispatch + LiteRT)
        run: |
          APK=$(ls apk-out/*.apk | head -1)
          unzip -l "$APK" | grep -iE "LiteRtDispatch|liblitertlm|neuron" || true
          unzip -l "$APK" | grep -qi "LiteRtDispatch_MediaTek.so" && echo "NPU dispatch lib present" || echo "WARN: dispatch lib missing"

      - name: Publish APK to a release (CDN delivery)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.2.3-omniinfer-fix7
          name: "OmniInfer 默认后端改回 OmniInfer-llama + 卡死诊断 APK (v0.6.2.3-fix7)"
          prerelease: true
          draft: false
          body: |
            基于 v0.6.2.3-omniinfer-fix6：
            - **推理后端默认改回 OmniInfer-llama（llama.cpp）**：新人引导页此前把后端强制设成
              litert(LiteRT-LM)，卸载重装后走一遍引导，后端就成了 LiteRT-LM，只能导 .litertlm，
              导 GGUF 会报「Please select a .litertlm model file」。现在引导推荐与内置本地模型
              profile 的推荐后端都改为 llama.cpp，推荐模型改为 llama 市场的 Gemma-4-E2B。
            - **卡死定位日志**：预填充每批打印 prefill progress i/total，解码每 32 token 打印
              decode progress n=.. pos=..；配合 generate: enter / prefill done 可判断是"慢"还是"真卡死"。
            - **卡死不再拖垮整个 app**：会话锁改为 std::timed_mutex，等 150s 仍拿不到锁就放弃本次
              请求并打日志，避免一个卡住的生成把后续所有聊天永久堵住。
            - **修复降级逻辑自我失效（关键）**：fix4 的 A 机制在加载成功后写了 ARMED=<当前档>，
              却从未清除。于是每次启动都会把"上次用过的档"拉黑，几次启动后 armv8 全被拉黑、
             候选为空，代码回退成"交给 ggml 自动选"，又选回了 SVE 的 armv9.0_1 —— 正是最初的崩溃。
              现在：ARMED 只在一次 generate() 期间生效、生成结束立即清除；候选被拉黑到空时自动重置
              黑名单；且**任何情况下都不会再回退到 SVE/armv9 变体**（兜底显式加载 armv8.0_1）。
            - **会话串行化**：nativeGenerate/nativeReset/nativeLoadHistory 增加每 handle 互斥锁。
              此前同一个 handle 并发 generate 会同时改同一份 llama_context / KV cache，导致
              ggml_compute_forward_set_rows 里的 GGML_ASSERT 越界崩溃（回复完闪退 / 停止也闪退）。
            - 保留 fix5：预填充(prefill)可取消 + 阶段诊断日志
            含 fix4：运行时保守自动降级（CPU 变体全保留 + A 跨重启降级 + B 同进程探针）
            含 fix2：CPU 端默认关闭 flash attention（可用 config {"flash_attn": true} 开启）
            含 fix1 的 4 项修复
            - 唤起宠物：悬浮窗 + 无障碍权限合并为一次引导（此前只弹无障碍）
            - 设置页文案：「本地模型」→「本地模型服务」
            - 本地模型服务页：补回集成接线（MnnLocalModelsChannel 注册、LocalModelFeatureInstaller 安装、ChannelManager/MainActivity 钩子转发），修复「配置加载失败/市场为空」
            - 设置页补回 iMessage 渠道入口与陪伴权限授权入口（+ 对应路由）
            - 顺带修复：StorageService 缺少字体特效开关方法导致编译失败
            天玑(MT6991) NPU：内置 libLiteRtDispatch_MediaTek.so，q4_ekv1280_mt6991 模型自动走 Backend.NPU。
          files: apk-out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push APK chunks to artifacts branch
        run: |
          git config user.email "hUh63@users.noreply.github.com"
          git config user.name "hUh63"
          mkdir -p chunks
          split -b 90m -d apk-out/*.apk chunks/app.part_
          git checkout --orphan apk-artifacts
          git rm -rf . -q || true
          git add -f chunks/
          git commit -m "APK chunks $(date -u +%Y%m%d%H%M%S)"
          git push origin apk-artifacts --force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniinfer-apk
          path: apk-out/*.apk
          if-no-files-found: error
