name: Build OmniInfer Edition APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: webchat/pnpm-lock.yaml

      - name: Install NDK 28.2.13676358
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Fetch framework sources
        run: |
          FB=third_party/omniinfer/framework
          mkdir -p $FB
          curl -sSL "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/b10919" -o /tmp/llama.tgz
          tar xzf /tmp/llama.tgz -C /tmp
          rm -rf $FB/llama.cpp
          mv /tmp/llama.cpp-b10919 $FB/llama.cpp
          # All CPU variants are kept in the build. Unstable ones (SVE/SVE2) are
          # avoided at runtime by the conservative auto-downgrade logic instead.
          echo "--- Android CPU variants ---"
          grep -n "android_armv" $FB/llama.cpp/ggml/src/CMakeLists.txt
          curl -sSL "https://codeload.github.com/alibaba/mnn/tar.gz/a03b005cf6f888ebf092e4753840f935827f9c36" -o /tmp/mnn.tgz
          tar xzf /tmp/mnn.tgz -C /tmp
          rm -rf $FB/mnn
          mv /tmp/MNN-a03b005cf6f888ebf092e4753840f935827f9c36 $FB/mnn
          ls $FB/llama.cpp/CMakeLists.txt $FB/mnn/CMakeLists.txt

      - name: Flutter pub get
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Gradle assembleProductionOmniinferRelease
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          printf '%s' "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"
          chmod +x ./gradlew
          # plugins/catalog.v1.json points at runtime-components/omniflow-gui-runtime-2.2.12.zip;
          # :app:syncPluginAssets uses artifacts/<that name> as its baseline input, so the archive
          # is committed in this repo (taken from upstream's
          # codex/current-version-checkpoint-20260920 branch, sha256 verified against the catalog).
          ./gradlew --no-daemon --build-cache --max-workers=4 \
            assembleProductionOmniinferRelease \
            -Ptarget=lib/main_omniinfer.dart \
            -Pomniinfer.abis=arm64-v8a \
            -POMNI_RELEASE_STORE_FILE="$RUNNER_TEMP/release.p12" \
            -POMNI_RELEASE_STORE_PWD="${{ secrets.RELEASE_PASSWORD }}" \
            -POMNI_RELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -POMNI_RELEASE_KEY_PWD="${{ secrets.RELEASE_PASSWORD }}"

      - name: Collect APK
        run: |
          mkdir -p apk-out
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk-out/ \;
          ls -la apk-out

      - name: Verify APK contents (arm64-only + ggml variants + NPU dispatch)
        run: |
          APK=$(ls apk-out/*.apk | head -1)
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" > /tmp/apk_list.txt
          grep -qi "libLiteRtDispatch_MediaTek.so" /tmp/apk_list.txt \
            && echo "NPU dispatch lib present" \
            || { echo "ERROR: LiteRtDispatch_MediaTek.so missing"; exit 1; }
          VARIANTS=$(grep -o "libggml-cpu-android_[a-z0-9_.]*\.so" /tmp/apk_list.txt | sort -u | wc -l)
          echo "ggml CPU variants: $VARIANTS"
          [ "$VARIANTS" -ge 7 ] || { echo "ERROR: expected >=7 CPU variants, got $VARIANTS"; exit 1; }
          # Release builds pass -Pomniinfer.abis=arm64-v8a: LiteRT's x86_64 slice
          # must not be shipped (upstream OmniInfer guidance).
          if grep -q "lib/x86_64/" /tmp/apk_list.txt; then
            echo "ERROR: x86_64 libs present but arm64-only was requested"; exit 1
          fi
          echo "APK shape OK (arm64-v8a only)"

      - name: Publish APK to a release (CDN delivery)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.3-omniinfer-v6.5.11
          # Without this the tag lands on the default branch's HEAD instead of the
          # commit this build actually checked out.
          target_commitish: ${{ github.sha }}
          name: "OmniInfer 版 · 四 tab 主界面 / 历史分片读 / 第三方 Agent 卸载 / targetSdk 37 (v0.6.3-omniinfer-v6.5.11)"
          prerelease: true
          draft: false
          body: |
            本轮 (v6.5.11)：15 个提交，主线是「合并上游 0.7 的主界面与导航重构」「历史展示加内存上限」
            「第三方 Agent 可控卸载」，以及 targetSdk 37 适配。全部改动只过编译门，未做真机回归。

            一、主界面与导航（对齐上游 0.7）
            - 首页改为四 tab（首页 / Agents / 轨迹 / 设置），聊天页改为 push 打开；原抽屉内的入口全部保留，
              设置页能力未减。
            - 引入 FlClash 导航与玻璃组件族（含 liquid glass shader 与许可证声明），首批页面接入玻璃化外观。

            二、历史与内存
            - 历史展示改为「片读 + 展示投影」：SQL 层把超过 32KB 的 summary/payloadJson 换成空串并返回字节数，
              每批 16 行、合计上限 100 条 / 1MB；超限正文流式复制到 offloads 目录，作为附件打开。
              超长会话不再撑爆 CursorWindow，翻历史也不再 O(n²)。
            - 删除会话时连带清理 offloads 目录，避免附件孤儿堆积。
            - 键集游标与「实际消费行数」语义保持不变，老的分页行为没有回退。

            三、第三方 Agent 卸载
            - 设置页新增卸载入口（二次确认），只删除本应用托管安装的包；外部安装的残留只提示、不删除，
              卸载失败只探测不重试，避免反复破坏用户设备。

            四、Android 17（targetSdk 37）
            - 新增 ACCESS_LOCAL_NETWORK 权限链路（MCP / Agent / webchat 各请求点）；未授权时只宣告回环地址，
              不再给出连不上的局域网 IP。
            - 语音朗读改为持有前台服务租约：后台朗读不会被系统回收；拿不到租约时仍按原逻辑在进程内播放，
              朗读不会失败。通知栏「停止朗读」与系统回收都会结束当前条目。

            五、发布与稳定性
            - 密钥存储改为 fail-closed（加密不可用不再降级写明文）；冷启动不再在主线程做 IO；OkHttp 不再在
              构造期建连接池。
            - proguard 改为 -keep class { <init>(...); <fields>; }，避免 R8 删类 / 合并模型导致 release 版
              Gson 反序列化失败。
            - 终端恢复 Material3 导航并移除 Miuix 依赖（JVM 目标回落 17）。

            安装后如遇异常，请反馈具体操作路径。
          files: apk-out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push APK chunks to artifacts branch
        run: |
          git config user.email "hUh63@users.noreply.github.com"
          git config user.name "hUh63"
          mkdir -p chunks
          split -b 90m -d apk-out/*.apk chunks/app.part_
          git checkout --orphan apk-artifacts
          git rm -rf . -q || true
          git add -f chunks/
          git commit -m "APK chunks $(date -u +%Y%m%d%H%M%S)"
          git push origin apk-artifacts --force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniinfer-apk
          path: apk-out/*.apk
          if-no-files-found: error
