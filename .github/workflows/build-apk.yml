name: Build OmniInfer Edition APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: webchat/pnpm-lock.yaml

      - name: Install NDK 28.2.13676358
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Fetch framework sources
        run: |
          FB=third_party/omniinfer/framework
          mkdir -p $FB
          curl -sSL "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/b10919" -o /tmp/llama.tgz
          tar xzf /tmp/llama.tgz -C /tmp
          rm -rf $FB/llama.cpp
          mv /tmp/llama.cpp-b10919 $FB/llama.cpp
          # All CPU variants are kept in the build. Unstable ones (SVE/SVE2) are
          # avoided at runtime by the conservative auto-downgrade logic instead.
          echo "--- Android CPU variants ---"
          grep -n "android_armv" $FB/llama.cpp/ggml/src/CMakeLists.txt
          curl -sSL "https://codeload.github.com/alibaba/mnn/tar.gz/a03b005cf6f888ebf092e4753840f935827f9c36" -o /tmp/mnn.tgz
          tar xzf /tmp/mnn.tgz -C /tmp
          rm -rf $FB/mnn
          mv /tmp/MNN-a03b005cf6f888ebf092e4753840f935827f9c36 $FB/mnn
          ls $FB/llama.cpp/CMakeLists.txt $FB/mnn/CMakeLists.txt

      - name: Flutter pub get
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Gradle assembleProductionOmniinferRelease
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          printf '%s' "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"
          chmod +x ./gradlew
          # plugins/catalog.v1.json points at runtime-components/omniflow-gui-runtime-2.2.12.zip;
          # :app:syncPluginAssets uses artifacts/<that name> as its baseline input, so the archive
          # is committed in this repo (taken from upstream's
          # codex/current-version-checkpoint-20260920 branch, sha256 verified against the catalog).
          ./gradlew --no-daemon --build-cache --max-workers=4 \
            assembleProductionOmniinferRelease \
            -Ptarget=lib/main_omniinfer.dart \
            -Pomniinfer.abis=arm64-v8a \
            -POMNI_RELEASE_STORE_FILE="$RUNNER_TEMP/release.p12" \
            -POMNI_RELEASE_STORE_PWD="${{ secrets.RELEASE_PASSWORD }}" \
            -POMNI_RELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -POMNI_RELEASE_KEY_PWD="${{ secrets.RELEASE_PASSWORD }}"

      - name: Collect APK
        run: |
          mkdir -p apk-out
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk-out/ \;
          ls -la apk-out

      - name: Verify APK contents (arm64-only + ggml variants + NPU dispatch)
        run: |
          APK=$(ls apk-out/*.apk | head -1)
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" > /tmp/apk_list.txt
          grep -qi "libLiteRtDispatch_MediaTek.so" /tmp/apk_list.txt \
            && echo "NPU dispatch lib present" \
            || { echo "ERROR: LiteRtDispatch_MediaTek.so missing"; exit 1; }
          VARIANTS=$(grep -o "libggml-cpu-android_[a-z0-9_.]*\.so" /tmp/apk_list.txt | sort -u | wc -l)
          echo "ggml CPU variants: $VARIANTS"
          [ "$VARIANTS" -ge 7 ] || { echo "ERROR: expected >=7 CPU variants, got $VARIANTS"; exit 1; }
          # Release builds pass -Pomniinfer.abis=arm64-v8a: LiteRT's x86_64 slice
          # must not be shipped (upstream OmniInfer guidance).
          if grep -q "lib/x86_64/" /tmp/apk_list.txt; then
            echo "ERROR: x86_64 libs present but arm64-only was requested"; exit 1
          fi
          echo "APK shape OK (arm64-v8a only)"

      - name: Publish APK to a release (CDN delivery)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.3-omniinfer-v6.5.10
          # Without this the tag lands on the default branch's HEAD instead of the
          # commit this build actually checked out.
          target_commitish: ${{ github.sha }}
          name: "OmniInfer 版 · 可选 Root 后端 / 特权链路与数据库修复 / webchat 稳定性 (v0.6.3-omniinfer-v6.5.10)"
          prerelease: true
          draft: false
          body: |
            本轮 (v6.5.10)：9 个提交，主线是「合并上游 0.7 的可选 Root 后端」「把特权链路 / 数据库 / webchat
            一批真实缺陷修掉」，以及一轮新的全域排查（崩溃、泄漏、启动阻塞）。全部改动只过编译门，未做
            真机回归；涉及 Root / Shizuku 的功能请在已授权设备上验证。

            一、可选 Root 后端（对齐上游 0.7）
            - baselib 新增 privileged 包（能力管理 / 命令执行 / 会话注册 / 设备控制 / 动作策略 / Root 探测），
              Shizuku 与 Root 共用同一套工具面；设置页新增「Root 访问」入口（开关 + 状态 + 一键检测）。
            - 工具层：android_privileged_action 支持 root 后端，shell.exec / 设备动作按授权结果放行。

            二、特权执行链路 5 处缺陷
            - 命令黑名单左边界不含 `/`：`/system/bin/reboot` 这类绝对路径可直接绕过；改为否定前瞻。
            - 持久 shell 把「命令 + 结束标记」一起写进 stdin，读 stdin 的命令会吞掉结束标记，卡到超时被
              整会话杀掉；改为 `{ command } </dev/null` 分组。
            - 一次 su IO 失败就把 Root 判为不可用并清掉「曾授权」标记，下次启动不再自动探测，Root 永久
              停在未授权；改为只有「明确被拒」才清标记。
            - ACP 会话关闭路径用 check() 断言关闭结果，抛异常会跳过 mcpSession.close() 与 onClosed()，
              会话资源永久泄漏；改为 runCatching + 日志，保证清理链一定走完。
            - session_start 被取消 / 远程超时后服务端会话残留（按 binding 找不到、按 requestId 也杀不到）；
              改为先登记再请求，取消路径在 NonCancellable 里回收。

            三、数据库与历史读取
            - agent_conversation_entries 补 (conversationId, conversationMode, createdAt) 与 entryType 索引，
              schema 19 → 20（MIGRATION_19_20）：历史读取与 stream_event 普查不再全量排序/全表扫描。
            - 历史读取与整段加载从 LIMIT/OFFSET 改键集游标，长会话 O(n²) → O(n)。
            - copyConversationHistory 逐条写入与 refreshConversationMetadata 的读-算-写包进事务
              （避免半截分叉历史、messageCount 回退）。
            - 删除会话/占位清理路径连带清 codex_thread_bindings，避免孤儿绑定把已删线程复活。

            四、ACP / webchat 稳定性
            - ACP 会话关闭链路补 finally：mcpSession.close() 失败不再跳过 onClosed/cleanupComplete；
              stdio MCP 关闭改为先停读再抢锁（原来会卡到 40s 超时，观感是「关不掉」）。
            - open() 取消时回收已连上的兄弟连接，避免泄漏 MCP 子进程。
            - webchat：工作区文件 move 原来先删目标再拷贝（同路径会删掉源文件、自嵌套会写满磁盘），
              改为 canonical 校验 + staging 改名；readFile 带 lineStart 会绕过 1MB 保护并整文件读进内存
              （几百 MB 日志直接 OOM），改为受字符预算约束并如实标记 truncated。
            - webchat 实时通道：401 时主动探测并回登录页（原来只标记 offline、每 3 秒无限重连）；
              ?token= 读完即从地址栏清除。
            - run 终态看门狗：用户点停止后 ACP 不回终态（进程挂死/连接断）时，该会话会永久锁在
              「运行中」，之后每次发消息都被拒。补 12s 取消宽限 + 30 分钟零事件双条件本地收敛。
            - 三张消息 entry 表跨协程读写加锁 + 快照迭代（原会抛 ConcurrentModificationException，
              打断事件消费协程，run 卡在运行中）。
            - 流式快照间隔按体量自适应（150ms → 最多 1.2s，目标 ≤1.5MB/s），长会话不再每秒推 6 次整段历史。

            五、附件（webchat）
            - 浏览器上传的图片只有 data URL，原来原样落库：base64 进消息 payload，既顶到 Room 单行 2MB
              的 CursorWindow 上限，又被每帧全量快照重推。改为先落盘，历史只留路径。
            - 新增 GET /webchat/api/conversations/attachment 按需取图（Cookie 鉴权、Cache-Control 24h），
              消息里的附件 dataUrl 换成该 URL。
            - 会话列表实时刷新改为 400ms 去抖 + 串行 + 在飞合并，归档列表只在归档状态变化时刷新
              （原来每条事件并行拉两次全量列表）。

            六、本轮新排查（崩溃 / 泄漏 / 启动）
            - stdio MCP 的 stdout/stderr 读取协程没有 catch：子进程退出时抛 IOException 会逃逸到没有
              CoroutineExceptionHandler 的共享 scope → 进程被杀。一个可选的第三方 MCP 挂掉不该带走整个 App。
            - 远端重连恢复逐条隔离：任一陈旧 sessionId 失败不再中断整张表的恢复（原来会退避重试 6 次
              仍命中同一条，所有会话都恢复不了，表现为「bridge 一连就断」）。
            - 无 listener 期间的事件缓冲加 512 条上限（原来一轮长回答几万条 delta 会一路涨到 OOM）；
              connect() 等待远端恢复加 20s 上限（原来在 sessionMutex 内可能卡 60s+，切 Provider 全部串行）。
            - App.onCreate 删掉 runBlocking 等 workspace seed：大迁移必然超过 2s，既把启动钉成 2s 白屏，
              超时后插件恢复还会和仍在跑的 seeder 并发写 skills 目录。插件恢复改到 seeder 线程末尾串行。
            - 语音播放 release() 补 scope.cancel() + OkHttp 回收（FlutterEngine 每次重建都泄漏一套）；
              已缓存 PCM 的停止不再被判定为播放失败。
            - 闹钟响铃加 5 分钟自动静音（原来 looping + 振动 repeat=0，只能手动关）。
            - 通知读取设置（枚举全部已安装应用）从平台主线程移到后台线程。
            - 手动录制浮层：show() 后一帧内取消会跳过 removeView 并清空句柄，留下一层吞掉全屏触摸的
              幽灵浮层（只能杀进程）；改为无条件 removeViewImmediate。
            - 自动保存进行中到达的编辑不再被丢弃（Remote PC Bridge 设置）；本地模型页轮询在页面被覆盖时
              停止；聊天页事件流被原生关闭后自动重订；权限页加载态收进 finally。

            七、安全与上游吸收杂项
            - MCP token 加密失败时不再降级写明文（该 token 能调 /mcp 全部设备工具）。
            - 吸收上游：Gson 模型防 R8 剥离、冷启动启动路径精简、models.dev 目录缓存落盘 + 后台解析、
              运行日志改为有界环形缓冲（流式读取 + 字节预算，避免日志文件无限增长）。

            安装后如遇异常，请反馈具体操作路径。
          files: apk-out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push APK chunks to artifacts branch
        run: |
          git config user.email "hUh63@users.noreply.github.com"
          git config user.name "hUh63"
          mkdir -p chunks
          split -b 90m -d apk-out/*.apk chunks/app.part_
          git checkout --orphan apk-artifacts
          git rm -rf . -q || true
          git add -f chunks/
          git commit -m "APK chunks $(date -u +%Y%m%d%H%M%S)"
          git push origin apk-artifacts --force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniinfer-apk
          path: apk-out/*.apk
          if-no-files-found: error
