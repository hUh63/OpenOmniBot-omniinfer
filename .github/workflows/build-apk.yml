name: Build OmniInfer Edition APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: webchat/pnpm-lock.yaml

      - name: Install NDK 28.2.13676358
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Fetch framework sources
        run: |
          FB=third_party/omniinfer/framework
          mkdir -p $FB
          curl -sSL "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/b10919" -o /tmp/llama.tgz
          tar xzf /tmp/llama.tgz -C /tmp
          rm -rf $FB/llama.cpp
          mv /tmp/llama.cpp-b10919 $FB/llama.cpp
          # All CPU variants are kept in the build. Unstable ones (SVE/SVE2) are
          # avoided at runtime by the conservative auto-downgrade logic instead.
          echo "--- Android CPU variants ---"
          grep -n "android_armv" $FB/llama.cpp/ggml/src/CMakeLists.txt
          curl -sSL "https://codeload.github.com/alibaba/mnn/tar.gz/a03b005cf6f888ebf092e4753840f935827f9c36" -o /tmp/mnn.tgz
          tar xzf /tmp/mnn.tgz -C /tmp
          rm -rf $FB/mnn
          mv /tmp/MNN-a03b005cf6f888ebf092e4753840f935827f9c36 $FB/mnn
          ls $FB/llama.cpp/CMakeLists.txt $FB/mnn/CMakeLists.txt

      - name: Flutter pub get
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Gradle assembleProductionOmniinferRelease
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          printf '%s' "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"
          chmod +x ./gradlew
          ./gradlew --no-daemon --build-cache --max-workers=4 \
            assembleProductionOmniinferRelease \
            -Ptarget=lib/main_omniinfer.dart \
            -Pomniinfer.abis=arm64-v8a \
            -POMNI_RELEASE_STORE_FILE="$RUNNER_TEMP/release.p12" \
            -POMNI_RELEASE_STORE_PWD="${{ secrets.RELEASE_PASSWORD }}" \
            -POMNI_RELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -POMNI_RELEASE_KEY_PWD="${{ secrets.RELEASE_PASSWORD }}"

      - name: Collect APK
        run: |
          mkdir -p apk-out
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk-out/ \;
          ls -la apk-out

      - name: Verify APK contents (arm64-only + ggml variants + NPU dispatch)
        run: |
          APK=$(ls apk-out/*.apk | head -1)
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" > /tmp/apk_list.txt
          grep -qi "libLiteRtDispatch_MediaTek.so" /tmp/apk_list.txt \
            && echo "NPU dispatch lib present" \
            || { echo "ERROR: LiteRtDispatch_MediaTek.so missing"; exit 1; }
          VARIANTS=$(grep -o "libggml-cpu-android_[a-z0-9_.]*\.so" /tmp/apk_list.txt | sort -u | wc -l)
          echo "ggml CPU variants: $VARIANTS"
          [ "$VARIANTS" -ge 7 ] || { echo "ERROR: expected >=7 CPU variants, got $VARIANTS"; exit 1; }
          # Release builds pass -Pomniinfer.abis=arm64-v8a: LiteRT's x86_64 slice
          # must not be shipped (upstream OmniInfer guidance).
          if grep -q "lib/x86_64/" /tmp/apk_list.txt; then
            echo "ERROR: x86_64 libs present but arm64-only was requested"; exit 1
          fi
          echo "APK shape OK (arm64-v8a only)"

      - name: Publish APK to a release (CDN delivery)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.3-omniinfer-v2
          name: "OmniInfer 版 · 移植官方独立组件能力 (v0.6.3-omniinfer-v2)"
          prerelease: true
          draft: false
          body: |
            在本仓 omniinfer 版（已同步官方 v0.6.3 + main）基础上，按官方 OmniInfer 独立组件的
            设计做了六项改造。本仓既有的本地推理修复与功能全部保留，未删除任何变体或能力。

            1. native lib 目录可注入（官方 OmniInferEngineLoader.installedNativeLibDir 同款钩子）
               - OmniInferServer 不再写死 applicationInfo.nativeLibraryDir
               - 新增 OmniInferNativeLibs：未装引擎时在应用私有目录构造“过滤镜像”
                 （全量 symlink，排除 CPU 变体），并先用 nativeProbeLibDir 以 ggml 完全相同
                 的 dlopen 路径验证该目录可用，不可用则回退原目录
               - 由此删除运行时选档/黑名单/ARMED 状态机/同进程探针（-213 行 C++）：
                 已注册的 ggml backend 本就无法安全卸载，过滤必须发生在注册之前
               - 默认排除 armv9（SVE2）档，全部 7 个变体仍留在 APK 内，可配置

            2. 引擎包机制（可下载 runtime）
               - OmniInferEngineManifest / OmniInferEngineLoader / OmniInferEngineDownloader
                 字段名、校验规则、目录布局与官方一致；逐库 size+sha256 校验、拒绝未列出的 .so、
                 拒绝解压路径逃逸、校验后原子改名、coreLibs 按序 System.load
               - 新增 Gradle 任务 bundleEnginePackage：解析 ELF DT_NEEDED 自动推出 coreLibs 顺序，
                 产出 omniinfer-engine-<ver>-arm64-v8a.zip + .zip.sha256，并回读成品逐条校验

            3. omniinfer.packaging.native_bundled 打包开关（false → lite AAR，坐标自动变 omniinfer-lite）

            4. BackendSelectors 收敛到一处
               - Kotlin：新增 BackendSelectors.kt（官方规范名 llama.cpp-cpu / llama.cpp-htp /
                 litert-lm-cpu / litert-lm-gpu / mnn-*，旧写法 auto、llama.cpp、litert/gpu 等仍作别名），
                 OmniInferServer 内 8 段重复实现删除；35 项映射回归自测全通过
               - Dart：新增 ui/services/inference_backend.dart，替换原先散在 4 个文件里的重复常量与
                 归一化函数（这正是引导页把后端写成 litert、导致 GGUF 导入报
                 “Please select a .litertlm model file” 的根因）

            5. 打包/依赖经验落地
               - 发布构建改为仅 arm64-v8a（-Pomniinfer.abis=arm64-v8a），剔除 LiteRT 传递来的
                 x86_64 无用切片（约 32MB）；本地/模拟器构建仍可保留 x86_64
               - 新增 docs/reference/omniinfer-android-integration.md：两种打包模式、优先用 Maven
                 坐标而非 flat AAR（否则需手补 Ktor 3.1.3 + kotlinx）、引擎包契约、目录注入原理、
                 选择器与 CMake 参数

            6. 对照确认 Android CMake 参数与官方一致（GGML_NATIVE=OFF、GGML_LLAMAFILE=OFF、
               GGML_BACKEND_DL=ON、GGML_CPU_ALL_VARIANTS=ON、LLAMA_BUILD_COMMON=ON、
               BUILD_SHARED_LIBS=ON；minSdk 26、abiFilters arm64-v8a），无需改动

            构建断言：arm64-v8a only、>=7 个 ggml CPU 变体、含 libLiteRtDispatch_MediaTek.so。
            天玑(MT6991) NPU：q4_ekv1280_mt6991 模型自动走 Backend.NPU。
          files: apk-out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push APK chunks to artifacts branch
        run: |
          git config user.email "hUh63@users.noreply.github.com"
          git config user.name "hUh63"
          mkdir -p chunks
          split -b 90m -d apk-out/*.apk chunks/app.part_
          git checkout --orphan apk-artifacts
          git rm -rf . -q || true
          git add -f chunks/
          git commit -m "APK chunks $(date -u +%Y%m%d%H%M%S)"
          git push origin apk-artifacts --force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniinfer-apk
          path: apk-out/*.apk
          if-no-files-found: error
