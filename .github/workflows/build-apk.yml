name: Build OmniInfer Edition APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: webchat/pnpm-lock.yaml

      - name: Install NDK 28.2.13676358
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Fetch framework sources
        run: |
          FB=third_party/omniinfer/framework
          mkdir -p $FB
          curl -sSL "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/b10919" -o /tmp/llama.tgz
          tar xzf /tmp/llama.tgz -C /tmp
          rm -rf $FB/llama.cpp
          mv /tmp/llama.cpp-b10919 $FB/llama.cpp
          # All CPU variants are kept in the build. Unstable ones (SVE/SVE2) are
          # avoided at runtime by the conservative auto-downgrade logic instead.
          echo "--- Android CPU variants ---"
          grep -n "android_armv" $FB/llama.cpp/ggml/src/CMakeLists.txt
          curl -sSL "https://codeload.github.com/alibaba/mnn/tar.gz/a03b005cf6f888ebf092e4753840f935827f9c36" -o /tmp/mnn.tgz
          tar xzf /tmp/mnn.tgz -C /tmp
          rm -rf $FB/mnn
          mv /tmp/MNN-a03b005cf6f888ebf092e4753840f935827f9c36 $FB/mnn
          ls $FB/llama.cpp/CMakeLists.txt $FB/mnn/CMakeLists.txt

      - name: Flutter pub get
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Gradle assembleProductionOmniinferRelease
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: |
          printf '%s' "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > "$RUNNER_TEMP/release.p12"
          chmod 600 "$RUNNER_TEMP/release.p12"
          chmod +x ./gradlew
          ./gradlew --no-daemon --build-cache --max-workers=4 \
            assembleProductionOmniinferRelease \
            -Ptarget=lib/main_omniinfer.dart \
            -POMNI_RELEASE_STORE_FILE="$RUNNER_TEMP/release.p12" \
            -POMNI_RELEASE_STORE_PWD="${{ secrets.RELEASE_PASSWORD }}" \
            -POMNI_RELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -POMNI_RELEASE_KEY_PWD="${{ secrets.RELEASE_PASSWORD }}"

      - name: Collect APK
        run: |
          mkdir -p apk-out
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk-out/ \;
          ls -la apk-out

      - name: Verify APK contents (MediaTek NPU dispatch + LiteRT)
        run: |
          APK=$(ls apk-out/*.apk | head -1)
          unzip -l "$APK" | grep -iE "LiteRtDispatch|liblitertlm|neuron" || true
          unzip -l "$APK" | grep -qi "LiteRtDispatch_MediaTek.so" && echo "NPU dispatch lib present" || echo "WARN: dispatch lib missing"

      - name: Publish APK to a release (CDN delivery)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.2.3-omniinfer-fix8
          name: "OmniInfer 多窗口卡住定位（三层日志）+ 默认后端 llama.cpp (v0.6.2.3-fix8)"
          prerelease: true
          draft: false
          body: |
            基于 v0.6.2.3-omniinfer-fix7：
            - **多窗口"一直卡在正在回复"三层定位日志**（本次是诊断版）：
              1) HTTP 层 OmniInferService: chatreq#N START/END active=K —— 能看出有两个请求同时在飞
                 （active>1），或者上一个请求根本没 END（被卡住的流/生成）。
              2) 桥接层 OmniInferBridge: generate enter/exit handle=.. ms=.. len=.. —— 进入/离开 native。
              3) native 层 OmniInferJni: nativeGenerate acquiring/acquired session lock wait_ms=..
                 + generate: enter / prefill progress / decode progress —— 是否卡在会话锁上。
            - 等不到会话锁（150s）时由静默返回空串改为返回 {"error":"local model busy..."}，
              前端能显示错误而不是一直转圈。
            - 保留 fix7：默认后端 = OmniInfer-llama(llama.cpp)，引导页不再强制 litert
            - 保留 fix6：变体降级自我失效修复 + 会话串行化
            - 保留 fix5：预填充(prefill)可取消 + 阶段诊断日志
            - 保留 fix4：运行时保守自动降级（CPU 变体全保留 + A 跨重启降级 + B 同进程探针）
            - 保留 fix2：CPU 端默认关闭 flash attention（config {"flash_attn": true} 可开启）
            - 保留 fix1 的 4 项修复（权限合并引导、文案、本地模型服务接线、iMessage/陪伴入口）
            天玑(MT6991) NPU：内置 libLiteRtDispatch_MediaTek.so，q4_ekv1280_mt6991 模型自动走 Backend.NPU。
          files: apk-out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push APK chunks to artifacts branch
        run: |
          git config user.email "hUh63@users.noreply.github.com"
          git config user.name "hUh63"
          mkdir -p chunks
          split -b 90m -d apk-out/*.apk chunks/app.part_
          git checkout --orphan apk-artifacts
          git rm -rf . -q || true
          git add -f chunks/
          git commit -m "APK chunks $(date -u +%Y%m%d%H%M%S)"
          git push origin apk-artifacts --force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniinfer-apk
          path: apk-out/*.apk
          if-no-files-found: error
